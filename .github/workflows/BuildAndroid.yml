name: Build Android (APK + AAB)

# ArtFoxel / ARTVERSE - Flutter Android build
# Repo me `android/` folder commit nahi hai, isliye workflow har run me
# `flutter create . --platforms=android` chalata hai, phir manifest + gradle patch karta hai.
#
# Output: APK + AAB  ->  Actions "Artifacts" + GitHub "Releases"

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write # Release banane ke liye

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: ArtFoxel
  ANDROID_ORG: com.shadowarcgames       # applicationId = com.shadowarcgames.artfoxel
  ANDROID_PROJECT_NAME: artfoxel
  AUTH_SCHEME: io.supabase.artverse     # Supabase Google login callback scheme
  AUTH_HOST: login-callback
  MIN_SDK: "23"                         # secure storage / AdMob ke liye safe minimum
  ADMOB_TEST_APP_ID: ca-app-pub-3940256099942544~3347511713

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ------------------------------------------------------------------
      # 1. Android platform folder generate karo (agar repo me nahi hai)
      # ------------------------------------------------------------------
      - name: Generate android platform
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org "$ANDROID_ORG" --project-name "$ANDROID_PROJECT_NAME"
            # flutter create ne agar tumhari files chhedi hon to wapas lao
            git checkout -- pubspec.yaml lib test 2>/dev/null || true
            # default sample test hatao (agar tumhara apna nahi tha)
            if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
              rm -f test/widget_test.dart
            fi
          else
            echo "android/ folder already exists - skipping flutter create"
          fi

      # ------------------------------------------------------------------
      # 2. .env file (Supabase secrets). Secrets na ho to guest/offline mode.
      # ------------------------------------------------------------------
      - name: Write .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::SUPABASE_URL secret not set - app guest/offline mode me chalega"
          fi

      # ------------------------------------------------------------------
      # 3. pubspec me declared assets exist karte hain? Missing ho to build na toote.
      # ------------------------------------------------------------------
      - name: Check declared assets
        run: |
          python3 - <<'PY'
          import re, pathlib, struct, zlib

          def tiny_png(path):
              def chunk(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              raw = b"\x00\xff\xff\xff\xff"
              png = (b"\x89PNG\r\n\x1a\n"
                     + chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 6, 0, 0, 0))
                     + chunk(b"IDAT", zlib.compress(raw))
                     + chunk(b"IEND", b""))
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(png)

          text = pathlib.Path("pubspec.yaml").read_text()
          for m in re.finditer(r"^\s*-\s+(assets/\S+)\s*$", text, re.M):
              p = pathlib.Path(m.group(1))
              if p.exists() or m.group(1).endswith("/"):
                  continue
              print(f"::warning::Declared asset missing: {p} - placeholder bana raha hoon (apna asset commit karo)")
              if p.suffix.lower() == ".png":
                  tiny_png(p)
              else:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.touch()
          PY

      # ------------------------------------------------------------------
      # 4. AndroidManifest patch: INTERNET, label, AdMob test id, Supabase deep link
      # ------------------------------------------------------------------
      - name: Patch AndroidManifest
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          mf = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = mf.read_text()
          pubspec = pathlib.Path("pubspec.yaml").read_text()

          # Permissions
          for perm in ("android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE"):
              if perm not in s:
                  s = re.sub(r"(<manifest[^>]*>)",
                             r'\1\n    <uses-permission android:name="%s"/>' % perm,
                             s, count=1)

          # App label
          s = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % os.environ["APP_NAME"], s, count=1)

          # AdMob app id (sirf jab google_mobile_ads dependency ho)
          if "google_mobile_ads" in pubspec and "com.google.android.gms.ads.APPLICATION_ID" not in s:
              admob = os.environ.get("ADMOB_APP_ID") or os.environ["ADMOB_TEST_APP_ID"]
              if admob == os.environ["ADMOB_TEST_APP_ID"]:
                  print("::warning::AdMob TEST app id use ho raha hai - release se pehle ADMOB_APP_ID secret set karo")
              meta = ('    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                      '               android:value="%s"/>\n' % admob)
              s = s.replace("</application>", meta + "  </application>", 1)

          # Supabase OAuth deep link (Google sign-in)
          host = os.environ["AUTH_HOST"]
          if host not in s:
              intent = (
                  '      <intent-filter>\n'
                  '        <action android:name="android.intent.action.VIEW"/>\n'
                  '        <category android:name="android.intent.category.DEFAULT"/>\n'
                  '        <category android:name="android.intent.category.BROWSABLE"/>\n'
                  '        <data android:scheme="%s" android:host="%s"/>\n'
                  '      </intent-filter>\n' % (os.environ["AUTH_SCHEME"], host)
              )
              s = s.replace("</activity>", intent + "    </activity>", 1)

          mf.write_text(s)
          print(s)
          PY

      # ------------------------------------------------------------------
      # 5. Signing (optional). Secrets set hain to release keystore se sign hoga,
      #    warna debug key se (Play Store ke liye upload nahi hoga).
      # ------------------------------------------------------------------
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Keystore secrets set nahi hain - build DEBUG key se sign hoga (Play Store ke liye nahi)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Gradle (minSdk + signing)
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys

          min_sdk = os.environ["MIN_SDK"]
          signed = os.environ.get("SIGNED") == "true"
          kts = pathlib.Path("android/app/build.gradle.kts")
          groovy = pathlib.Path("android/app/build.gradle")

          if kts.exists():
              s = kts.read_text()
              s = s.replace("minSdk = flutter.minSdkVersion",
                            "minSdk = maxOf(flutter.minSdkVersion, %s)" % min_sdk)
              if signed:
                  if "import java.util.Properties" not in s:
                      s = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + s
                  block = '''
              val keystoreProperties = Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
              }

              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
                  s = s.replace("android {", "android {" + block, 1)
                  s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
                  if 'signingConfigs.getByName("release")' not in s:
                      print("::error::Release signing config patch fail hua (build.gradle.kts format badla?)")
                      sys.exit(1)
              kts.write_text(s)
              print(s)
          elif groovy.exists():
              s = groovy.read_text()
              s = s.replace("minSdkVersion flutter.minSdkVersion",
                            "minSdkVersion Math.max(flutter.minSdkVersion, %s)" % min_sdk)
              s = s.replace("minSdk = flutter.minSdkVersion",
                            "minSdk = Math.max(flutter.minSdkVersion, %s)" % min_sdk)
              if signed:
                  block = '''
              def keystoreProperties = new Properties()
              def keystorePropertiesFile = rootProject.file('key.properties')
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              }

              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
                  s = s.replace("android {", "android {" + block, 1)
                  s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  if "signingConfigs.release" not in s:
                      print("::error::Release signing config patch fail hua (build.gradle format badla?)")
                      sys.exit(1)
              groovy.write_text(s)
              print(s)
          else:
              print("::error::android/app/build.gradle(.kts) nahi mila")
              sys.exit(1)
          PY

      # ------------------------------------------------------------------
      # 6. Dependencies, analyze, tests (block nahi karte)
      # ------------------------------------------------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: |
          if [ -d test ] && [ -n "$(find test -name '*_test.dart' | head -1)" ]; then
            flutter test
          else
            echo "No tests found - skipping"
          fi

      # ------------------------------------------------------------------
      # 7. Build APK + AAB
      # ------------------------------------------------------------------
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Collect outputs
        id: collect
        run: |
          VERSION_NAME=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')
          BASE="${APP_NAME}-v${VERSION_NAME}-build${{ github.run_number }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${BASE}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${BASE}.aab"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.base }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------------
      # 8. GitHub Release (sirf push on main / manual run)
      # ------------------------------------------------------------------
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TITLE: ${{ steps.collect.outputs.base }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGN_NOTE="Signed with release keystore (Play Store ready AAB)."
          else
            SIGN_NOTE="DEBUG-signed build - testing only, Play Store par upload nahi hoga."
          fi
          NOTES="Commit: ${GITHUB_SHA}
          ${SIGN_NOTE}
          Files: APK (direct install) + AAB (Play Store)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
